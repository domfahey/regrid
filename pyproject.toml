[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regrid-sdk"
version = "0.1.0"
description = "Python client for the Regrid Parcel and Tileserver APIs"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.12,<3"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Repository = "https://github.com/domfahey/regrid"
Issues = "https://github.com/domfahey/regrid/issues"
Changelog = "https://github.com/domfahey/regrid/blob/main/changelog.md"

[project.scripts]
regrid = "regrid.cli:main"

[dependency-groups]
dev = [
    "pytest>=8", "pytest-cov>=7",
    "ruff>=0.9",
    "mypy>=1.10",
    "build>=1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/regrid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: subprocess and real local HTTPS integration tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["regrid"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
