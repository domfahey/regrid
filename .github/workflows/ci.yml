name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.13.9
      - run: make install
      - if: matrix.python == '3.12'
        run: make check
      - if: matrix.python != '3.12'
        run: make test
      - run: make e2e
      - if: matrix.python == '3.12'
        run: .venv/bin/python scripts/build_claude_plugins.py
      - if: matrix.python == '3.12'
        run: uv build
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.9
      - run: uv sync --group dev
      - run: >-
          uv run pytest
          tests/test_regrid_map.py
          tests/test_regrid_workflow.py
          tests/test_regrid_workflow_composition.py
          tests/test_skill_helper_sync.py
          tests/test_cli_offline.py
          tests/test_offline_fields.py
          tests/test_offline_freshness.py
          tests/test_cli_freshness.py
          tests/test_claude_plugins.py
          tests/test_regrid_discovery.py
          tests/test_regrid_discovery_claude.py
          tests/test_regrid_feature_evals.py
